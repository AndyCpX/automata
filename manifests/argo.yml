apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-deployment
  namespace: default
spec:
  destination:
    name: local-cluster
    namespace: default
  project: default
  source:
    repoURL: https://github.com/AndyCpX/automata
    path: .
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 1m
        factor: 2
        maxDuration: 1h
      limit: 3
    syncOptions:
      - CreateNamespace=true